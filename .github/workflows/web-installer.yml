name: Packaged web and installer acceptance

on:
  push:
    branches: [codex/local-web-desktop]
    paths: ['windows/workbench/**', '.github/workflows/web-installer.yml']
  workflow_dispatch:
    inputs:
      legacy_fixture_tag:
        description: Optional restricted draft fixture tag for the authentic 0.11.4 installer
        required: false
        type: string
      candidate_sha256:
        description: Optional SHA-256 of the exact candidate installer in the restricted fixture
        required: false
        type: string

permissions:
  contents: read

jobs:
  install:
    # GitHub requires contents:write to read draft release assets. This job
    # only downloads the fixture; it never publishes or edits a release.
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scenario: [fresh, upgrade]
    defaults:
      run:
        working-directory: windows/workbench
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/workbench/package-lock.json
      - run: npm ci --workspaces=false --no-audit --no-fund
      - run: node node_modules/electron/install.js
      - run: npm run build -- --publish never
      - name: Verify packaged browser and background modes
        run: |
          $env:WAREHOUSE_TEST_EXE=(Resolve-Path 'dist/win-unpacked/CainiaoWarehouse.exe').Path
          npm run test:ui:web
          if($LASTEXITCODE -ne 0){throw 'Packaged web UI failed'}
          node tests/local-web-lifecycle.mjs
          if($LASTEXITCODE -ne 0){throw 'Packaged lifecycle failed'}
      - name: Stage candidate and authentic coexistence installers
        id: fixtures
        env:
          GH_TOKEN: ${{ github.token }}
          SCENARIO: ${{ matrix.scenario }}
          LEGACY_FIXTURE_TAG: ${{ inputs.legacy_fixture_tag }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
        run: |
          New-Item -ItemType Directory C:\Input,C:\WorkbenchInput,C:\Kit,C:\Results -Force | Out-Null
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          $file="CainiaoWarehouse-Setup-$version-x64.exe"
          Copy-Item -LiteralPath "dist/$file" C:\Input
          $spec=@{file=$file;version=$version;sha256=(Get-FileHash "dist/$file").Hash.ToLowerInvariant();webEntry=$true;workbenchFile='CloudWarehouseInventorySync-Setup-0.11.4-x64.exe';workbenchSha256='700d64b5878929384864a828d63f6cc555f603bf540aea0f314f3b621af256ff'}
          if($env:SCENARIO -eq 'upgrade'){
            gh release download v0.9.7 --repo $env:GITHUB_REPOSITORY --pattern CainiaoWarehouse-Setup-0.9.7-x64.exe --dir C:\Input
            if($LASTEXITCODE -ne 0){throw 'Previous cloud download failed'}
            $spec.previousFile='CainiaoWarehouse-Setup-0.9.7-x64.exe'
            $spec.previousSha256='ef82cbeb11fa29a036093579b9b4355a5f9b3f27e4c0cc9bfef7e37d38b41bc6'
            $spec.previousVersion='0.9.7'
          }
          if($env:LEGACY_FIXTURE_TAG){
            $expected=@(1..13 | Where-Object {$_ -ne 4} | ForEach-Object {'legacy-workbench.7z.'+$_.ToString('000')})
            $expected+=@(1..9 | ForEach-Object {'legacy-gap.7z.'+$_.ToString('000')})
            if($env:CANDIDATE_SHA256){$expected+=$file}
            $ready=$false
            for($attempt=0;$attempt -lt 60;$attempt++){
              $metadata=gh release view $env:LEGACY_FIXTURE_TAG --repo $env:GITHUB_REPOSITORY --json assets 2>$null
              if($LASTEXITCODE -eq 0){
                $names=@(($metadata | ConvertFrom-Json).assets | Where-Object state -eq 'uploaded' | Select-Object -ExpandProperty name)
                if(@($expected | Where-Object {$_ -notin $names}).Count -eq 0){$ready=$true;break}
              }
              Start-Sleep -Seconds 10
            }
            if(!$ready){throw 'Restricted installer fixture upload did not finish within ten minutes'}
          }
          if($env:CANDIDATE_SHA256){
            if(!$env:LEGACY_FIXTURE_TAG -or $env:CANDIDATE_SHA256 -notmatch '^[a-fA-F0-9]{64}$'){throw 'Exact candidate requires fixture tag and SHA-256'}
            New-Item -ItemType Directory C:\ExactCandidate -Force | Out-Null
            $transferOutput=gh release download $env:LEGACY_FIXTURE_TAG --repo $env:GITHUB_REPOSITORY --pattern $file --dir C:\ExactCandidate 2>&1
            if($LASTEXITCODE -ne 0){throw 'Exact candidate download failed'}
            if((Get-FileHash "C:\ExactCandidate\$file").Hash.ToLowerInvariant() -ne $env:CANDIDATE_SHA256.ToLowerInvariant()){throw 'Exact candidate hash mismatch'}
            Copy-Item -LiteralPath "C:\ExactCandidate\$file" -Destination "C:\Input\$file" -Force
            $spec.sha256=$env:CANDIDATE_SHA256.ToLowerInvariant()
          }
          $spec | ConvertTo-Json | Set-Content C:\Kit\candidate.json
          try {
            if($env:LEGACY_FIXTURE_TAG){
              if($env:LEGACY_FIXTURE_TAG -notmatch '^coexistence-fixture-[a-zA-Z0-9-]+$'){throw 'Invalid fixture tag'}
              $transferOutput=gh release download $env:LEGACY_FIXTURE_TAG --repo $env:GITHUB_REPOSITORY --pattern 'legacy-workbench.7z.*' --dir C:\WorkbenchInput 2>&1
              if($LASTEXITCODE -ne 0){throw 'Restricted legacy fixture download failed'}
              $sevenZip=Get-Command 7z.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1
              if(!$sevenZip){$sevenZip=Get-ChildItem (Join-Path $env:LOCALAPPDATA 'electron-builder/Cache') -Filter 7za.exe -Recurse -File | Select-Object -ExpandProperty FullName -First 1}
              if(!$sevenZip){throw 'Existing 7-Zip tool not found'}
              $transferOutput=gh release download $env:LEGACY_FIXTURE_TAG --repo $env:GITHUB_REPOSITORY --pattern 'legacy-gap.7z.*' --dir C:\WorkbenchInput 2>&1
              if($LASTEXITCODE -ne 0){throw 'Small-volume fixture download failed'}
              & $sevenZip x 'C:\WorkbenchInput\legacy-gap.7z.001' '-oC:\WorkbenchInput' '-y'
              if($LASTEXITCODE -ne 0){throw 'Small-volume fixture extraction failed'}
              & $sevenZip x 'C:\WorkbenchInput\legacy-workbench.7z.001' '-oC:\WorkbenchInput' '-y'
              if($LASTEXITCODE -ne 0){throw 'Restricted legacy fixture extraction failed'}
            }else{
              Invoke-WebRequest 'https://github.com/907609732/wucheng-ecommerce-erp-v2/releases/download/0.11.4/CloudWarehouseInventorySync-Setup-0.11.4-x64.exe' -OutFile C:\WorkbenchInput\CloudWarehouseInventorySync-Setup-0.11.4-x64.exe
            }
          } catch {
            if($env:LEGACY_FIXTURE_TAG){throw 'Explicit legacy fixture unavailable; full coexistence acceptance cannot continue'}
            'available=false' >> $env:GITHUB_OUTPUT
            @{skipped=$true;reason='Legacy authentic workbench release asset unavailable; verify coexistence in local Windows Sandbox with hash-verified retained installer'} | ConvertTo-Json | Set-Content C:\Results\legacy-baseline-unavailable.json
            'Legacy coexistence installation SKIPPED: public 0.11.4 installer asset unavailable. Packaged web/runtime checks above are independent; see local Sandbox evidence for installation.' >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          'available=true' >> $env:GITHUB_OUTPUT

      - name: Test real installation and both launch entries
        if: steps.fixtures.outputs.available == 'true'
        run: |
          & ./tests/windows-installer-sandbox.ps1 -HostedRunner
          $report=Get-Content C:\Results\result.json -Raw | ConvertFrom-Json
          $report | ConvertTo-Json -Depth 8
          if(!$report.ok){throw 'Installer acceptance failed'}
      - name: Test real cloud installation when legacy baseline is unavailable
        if: steps.fixtures.outputs.available == 'false'
        run: |
          & ./tests/windows-cloud-installer.ps1
          $report=Get-Content C:\Results\result.json -Raw | ConvertFrom-Json
          $report | ConvertTo-Json -Depth 8
          if(!$report.ok){throw 'Cloud-only installer acceptance failed'}
      - uses: actions/upload-artifact@v4
        if: success() && matrix.scenario == 'fresh'
        with:
          name: release-windows-x64
          path: |
            windows/workbench/dist/*.exe
            windows/workbench/dist/*.blockmap
            windows/workbench/dist/latest.yml
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-web-install-${{ matrix.scenario }}
          path: C:\Results\
          if-no-files-found: warn
