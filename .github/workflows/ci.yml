name: Windows CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows/workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/workbench/package-lock.json
      - run: npm ci --workspaces=false --no-audit --no-fund
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run test:ui
