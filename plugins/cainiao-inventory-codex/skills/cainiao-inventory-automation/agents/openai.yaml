interface:
  display_name: "菜鸟库存自动化"
  short_description: "安全配置、抓取、验真、发送并定时运行菜鸟云仓库存日报"
  default_prompt: "Use $cainiao-inventory-automation to check setup and run the Cainiao inventory workflow."

dependencies:
  tools:
    - type: "mcp"
      value: "cainiaoInventory"
      description: "Local Cainiao inventory setup, validation, DingTalk, and scheduling tools"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
